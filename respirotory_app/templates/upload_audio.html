<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Audio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #2c2f3b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 8px 8px 15px rgba(0, 0, 0, 0.4), -8px -8px 15px rgba(255, 255, 255, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .icon {
            font-size: 50px;
            color: #56b4f9;
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background-color: #292929;
            border-radius: 15px;
            border: 1px solid #333;
            padding: 10px 20px;
            color: white;
            font-size: 1rem;
            display: inline-block;
            cursor: pointer;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1), -5px -5px 15px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .file-label:hover {
            background-color: #333;
            box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.2), -5px -5px 20px rgba(255, 255, 255, 0.2);
        }

        button {
            background-color: #56b4f9;
            border-radius: 15px;
            padding: 12px 25px;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1), -5px -5px 15px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #2a8adf;
            box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.2), -5px -5px 20px rgba(255, 255, 255, 0.2);
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #56b4f9;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"><i class="fas fa-microphone"></i></div>
        <h1>Upload an Audio File for Diagnosis</h1>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="file-upload" class="file-label">
                <i class="fas fa-upload"></i> Choose an Audio File
            </label>
            <input id="file-upload" type="file" name="file">
            
            <button type="submit"><i class="fas fa-paper-plane"></i> Upload and Predict</button>
        </form>
    </div>
</body>
</html>
